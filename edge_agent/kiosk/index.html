<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0c0a" />
    <title>Conet Tactile — On-device kiosk</title>
    <link rel="stylesheet" href="/kiosk/styles.css" />
  </head>
  <body class="kiosk">
    <header class="kiosk__header">
      <div class="kiosk__brand">
        <span class="kiosk__dot" id="status-dot" aria-hidden="true"></span>
        <span class="kiosk__brand-word">Conet&nbsp;Tactile</span>
      </div>
      <div class="kiosk__id">
        <span id="kiosk-edge-id">edge-—</span>
        <span class="kiosk__sep" aria-hidden="true">·</span>
        <span id="kiosk-line-id">line-—</span>
      </div>
      <div class="kiosk__clock" id="kiosk-clock">—</div>
    </header>

    <main class="kiosk__main">
      <section class="kiosk__verdict" aria-live="polite">
        <p class="kiosk__verdict-label">Last verdict</p>
        <p class="kiosk__verdict-value" id="kiosk-verdict">—</p>
        <p class="kiosk__verdict-score">
          score <span id="kiosk-score">0.00</span>
        </p>
      </section>

      <section class="kiosk__metrics">
        <article class="kiosk__metric">
          <p class="kiosk__metric-label">Inference</p>
          <p class="kiosk__metric-value">
            <span id="kiosk-p50">—</span><span class="kiosk__metric-unit">ms p50</span>
          </p>
          <p class="kiosk__metric-sub">
            <span id="kiosk-p99">—</span> ms p99
          </p>
        </article>
        <article class="kiosk__metric">
          <p class="kiosk__metric-label">Scan rate</p>
          <p class="kiosk__metric-value">
            <span id="kiosk-fps">—</span><span class="kiosk__metric-unit">fps</span>
          </p>
          <p class="kiosk__metric-sub">
            <span id="kiosk-frames">0</span> frames total
            · <span id="kiosk-dropped">0</span> dropped
          </p>
        </article>
        <article class="kiosk__metric">
          <p class="kiosk__metric-label">Scanner port</p>
          <p class="kiosk__metric-value kiosk__metric-value--small">
            <span id="kiosk-port">—</span>
          </p>
          <p class="kiosk__metric-sub">
            agent <span id="kiosk-version">—</span>
          </p>
        </article>
      </section>

      <section class="kiosk__actions">
        <button class="kiosk__btn" id="btn-calibrate" type="button">
          Calibrate (5 known-good)
        </button>
        <button class="kiosk__btn kiosk__btn--quiet" id="btn-recipe" type="button">
          Switch recipe
        </button>
        <button class="kiosk__btn kiosk__btn--quiet" id="btn-ack" type="button">
          Acknowledge alert
        </button>
      </section>
    </main>

    <footer class="kiosk__footer">
      <span>Conet&nbsp;Tactile · on-device kiosk</span>
      <span id="kiosk-network">connecting…</span>
    </footer>

    <script src="/kiosk/kiosk.js" defer></script>
  </body>
</html>
