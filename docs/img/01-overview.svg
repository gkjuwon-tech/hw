<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="980" height="400" fill="#ffffff"/>
  <text x="32" y="46" font-size="26" font-weight="700" fill="#14110f">전체 그림 한 장 — 데이터가 흐르는 길</text>
  <text x="32" y="74" font-size="15" fill="#8a8a86">왼쪽에서 오른쪽으로. 파란 박스 = 네 손이 닿는 일. 회색 박스 = 형이 이미 다 한 SW.</text>

  <!-- box 1: 깔판 -->
  <rect x="32" y="120" width="158" height="124" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="111" y="156" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">① 깔판</text>
  <text x="111" y="180" font-size="13" fill="#334155" text-anchor="middle">Tactile Mesh</text>
  <text x="111" y="202" font-size="12" fill="#64748b" text-anchor="middle">압력 센서</text>
  <text x="111" y="226" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">← 네 가위질</text>

  <!-- box 2: PCB -->
  <rect x="222" y="120" width="158" height="124" rx="14" fill="#f4f5f3" stroke="#9aa0a6" stroke-width="3"/>
  <text x="301" y="156" font-size="16" font-weight="700" fill="#3f3f46" text-anchor="middle">② Scanner PCB</text>
  <text x="301" y="180" font-size="13" fill="#334155" text-anchor="middle">ESP32-S3</text>
  <text x="301" y="202" font-size="12" fill="#64748b" text-anchor="middle">형 설계·JLCPCB 조립</text>
  <text x="301" y="226" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">← 너: 발주+케이블</text>

  <!-- box 3: Jetson Edge -->
  <rect x="412" y="120" width="166" height="124" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="495" y="156" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">③ Jetson Edge</text>
  <text x="495" y="180" font-size="13" fill="#334155" text-anchor="middle">Orin Nano</text>
  <text x="495" y="202" font-size="12" fill="#64748b" text-anchor="middle">edge_agent (형)</text>
  <text x="495" y="226" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">← 너: 조립+셋업</text>

  <!-- box 4: Cloud -->
  <rect x="610" y="120" width="158" height="124" rx="14" fill="#f4f5f3" stroke="#9aa0a6" stroke-width="3"/>
  <text x="689" y="156" font-size="16" font-weight="700" fill="#3f3f46" text-anchor="middle">④ Cloud</text>
  <text x="689" y="180" font-size="13" fill="#334155" text-anchor="middle">FastAPI · AI</text>
  <text x="689" y="202" font-size="12" fill="#64748b" text-anchor="middle">docker compose up</text>
  <text x="689" y="226" font-size="12" fill="#64748b" text-anchor="middle">형이 다 짬</text>

  <!-- box 5: 판정 -->
  <rect x="800" y="120" width="148" height="124" rx="14" fill="#f7fee7" stroke="#84cc16" stroke-width="3"/>
  <text x="874" y="160" font-size="15" font-weight="700" fill="#4d7c0f" text-anchor="middle">⑤ 판정</text>
  <text x="874" y="192" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">pass</text>
  <text x="874" y="214" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">fail</text>

  <!-- arrows -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#52525b"/>
    </marker>
  </defs>
  <line x1="190" y1="182" x2="220" y2="182" stroke="#52525b" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="380" y1="182" x2="410" y2="182" stroke="#52525b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="395" y="172" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">USB-C</text>
  <line x1="578" y1="182" x2="608" y2="182" stroke="#52525b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="593" y="172" font-size="10.5" fill="#0369a1" text-anchor="middle" font-weight="700">HTTPS</text>
  <line x1="768" y1="182" x2="798" y2="182" stroke="#52525b" stroke-width="3" marker-end="url(#ah)"/>

  <!-- legend -->
  <rect x="32" y="290" width="916" height="84" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="52" y="312" width="22" height="22" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="84" y="328" font-size="14" fill="#1d4ed8" font-weight="700">네 일 (손 쓰는 거)</text>
  <text x="84" y="352" font-size="12.5" fill="#475569">깔판 가위질 · 부품 발주 · 케이블 · Jetson 조립+셋업+캘리브</text>
  <rect x="540" y="312" width="22" height="22" rx="5" fill="#f4f5f3" stroke="#9aa0a6" stroke-width="2.5"/>
  <text x="572" y="328" font-size="14" fill="#3f3f46" font-weight="700">형 일 (이미 끝남)</text>
  <text x="572" y="352" font-size="12.5" fill="#475569">PCB 설계 · 펌웨어 · edge_agent · 백엔드 · AI · 결제 · 이 그림</text>
</svg>
