<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <text x="32" y="46" font-size="26" font-weight="700" fill="#14110f">PCB 연결 — 케이블 2개면 끝</text>
  <text x="32" y="74" font-size="15" fill="#8a8a86">가로줄(행) → J1, 세로줄(열) → J2, 그리고 USB-C 한 가닥 → Jetson Edge. 이게 전부.</text>

  <!-- mesh on left -->
  <rect x="40" y="130" width="150" height="200" rx="10" fill="#fafaf9" stroke="#14110f" stroke-width="2"/>
  <g stroke="#f59e0b" stroke-width="5" opacity="0.85">
    <line x1="50" y1="160" x2="180" y2="160"/><line x1="50" y1="185" x2="180" y2="185"/>
    <line x1="50" y1="210" x2="180" y2="210"/>
  </g>
  <g stroke="#2563eb" stroke-width="5" opacity="0.65">
    <line x1="80" y1="245" x2="80" y2="320"/><line x1="110" y1="245" x2="110" y2="320"/>
    <line x1="140" y1="245" x2="140" y2="320"/>
  </g>
  <text x="115" y="352" font-size="13" fill="#14110f" text-anchor="middle" font-weight="700">깔판</text>
  <text x="115" y="372" font-size="11" fill="#b45309" text-anchor="middle">가로 16 / 세로 16</text>

  <!-- PCB in middle -->
  <rect x="330" y="120" width="230" height="220" rx="12" fill="#052e16" stroke="#14532d" stroke-width="3"/>
  <text x="445" y="232" font-size="15" fill="#bbf7d0" text-anchor="middle" font-weight="700">Scanner PCB</text>
  <text x="445" y="254" font-size="12" fill="#86efac" text-anchor="middle">ESP32-S3</text>

  <!-- J1 connector (left edge = ROW) -->
  <rect x="318" y="150" width="24" height="70" rx="4" fill="#f59e0b"/>
  <text x="352" y="142" font-size="14" fill="#f59e0b" font-weight="700">J1 = 행(ROW)</text>

  <!-- J2 connector (top edge = COL) -->
  <rect x="380" y="108" width="100" height="22" rx="4" fill="#2563eb"/>
  <text x="430" y="100" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">J2 = 열(COL)</text>

  <!-- USB-C (right edge) -->
  <rect x="548" y="220" width="26" height="40" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="561" y="288" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">USB-C</text>

  <!-- cables: rows -> J1 -->
  <path d="M190 185 C 260 185, 270 185, 318 185" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <!-- cables: cols -> J2 -->
  <path d="M110 245 C 110 60, 430 70, 430 108" fill="none" stroke="#2563eb" stroke-width="4"/>

  <!-- jetson on right -->
  <rect x="640" y="170" width="170" height="110" rx="10" fill="#052e16" stroke="#14532d" stroke-width="2"/>
  <rect x="656" y="186" width="138" height="60" rx="5" fill="#16a34a" opacity="0.20"/>
  <circle cx="668" cy="262" r="5" fill="#84cc16"/>
  <circle cx="686" cy="262" r="5" fill="#334155"/>
  <text x="725" y="222" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="700">Jetson Edge</text>
  <text x="725" y="242" font-size="11" fill="#86efac" text-anchor="middle">Orin Nano · /dev/ttyACM0</text>
  <!-- usb-c cable to jetson -->
  <path d="M574 240 C 610 240, 620 225, 640 225" fill="none" stroke="#64748b" stroke-width="4"/>

  <!-- warning -->
  <rect x="32" y="388" width="796" height="64" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="48" y="414" font-size="15" fill="#b91c1c" font-weight="700">주의 — J1 = 행(가로, 주황),  J2 = 열(세로, 파랑). 바꿔 꽂지 마.</text>
  <text x="48" y="436" font-size="13" fill="#7f1d1d">바꿔 꽂으면 압력 지도가 90° 돌아감(동작은 하는데 좌표 뒤집힘). USB-C는 이제 Jetson에 꽂음(노트북 아님).</text>
</svg>
