<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="780" height="620" fill="#ffffff"/>
  <text x="32" y="46" font-size="26" font-weight="700" fill="#14110f">위에서 본 격자 — 이 치수 그대로 잘라</text>
  <text x="32" y="74" font-size="15" fill="#8a8a86">주황 ═ 가로줄(행) 16개, 파랑 │ 세로줄(열) 16개. 직교(90°)로 겹쳐. 교차점 = 셀.</text>

  <!-- overall square -->
  <rect x="150" y="120" width="400" height="400" fill="#fafaf9" stroke="#14110f" stroke-width="2"/>

  <!-- horizontal rows (orange) -->
  <g stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="160" y1="135" x2="540" y2="135"/><line x1="160" y1="160" x2="540" y2="160"/>
    <line x1="160" y1="185" x2="540" y2="185"/><line x1="160" y1="210" x2="540" y2="210"/>
    <line x1="160" y1="235" x2="540" y2="235"/><line x1="160" y1="260" x2="540" y2="260"/>
    <line x1="160" y1="285" x2="540" y2="285"/><line x1="160" y1="310" x2="540" y2="310"/>
    <line x1="160" y1="335" x2="540" y2="335"/><line x1="160" y1="360" x2="540" y2="360"/>
    <line x1="160" y1="385" x2="540" y2="385"/><line x1="160" y1="410" x2="540" y2="410"/>
    <line x1="160" y1="435" x2="540" y2="435"/><line x1="160" y1="460" x2="540" y2="460"/>
    <line x1="160" y1="485" x2="540" y2="485"/><line x1="160" y1="505" x2="540" y2="505"/>
  </g>
  <!-- vertical cols (blue) -->
  <g stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity="0.7">
    <line x1="165" y1="128" x2="165" y2="512"/><line x1="190" y1="128" x2="190" y2="512"/>
    <line x1="215" y1="128" x2="215" y2="512"/><line x1="240" y1="128" x2="240" y2="512"/>
    <line x1="265" y1="128" x2="265" y2="512"/><line x1="290" y1="128" x2="290" y2="512"/>
    <line x1="315" y1="128" x2="315" y2="512"/><line x1="340" y1="128" x2="340" y2="512"/>
    <line x1="365" y1="128" x2="365" y2="512"/><line x1="390" y1="128" x2="390" y2="512"/>
    <line x1="415" y1="128" x2="415" y2="512"/><line x1="440" y1="128" x2="440" y2="512"/>
    <line x1="465" y1="128" x2="465" y2="512"/><line x1="490" y1="128" x2="490" y2="512"/>
    <line x1="515" y1="128" x2="515" y2="512"/><line x1="535" y1="128" x2="535" y2="512"/>
  </g>

  <!-- one cell highlighted -->
  <rect x="153" y="123" width="25" height="25" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="120" y="118" font-size="13" fill="#dc2626" font-weight="700">셀 (1,1)</text>

  <!-- dimension: overall 200mm (top) -->
  <line x1="150" y1="104" x2="550" y2="104" stroke="#52525b" stroke-width="1.5"/>
  <line x1="150" y1="99" x2="150" y2="109" stroke="#52525b" stroke-width="1.5"/>
  <line x1="550" y1="99" x2="550" y2="109" stroke="#52525b" stroke-width="1.5"/>
  <rect x="312" y="93" width="76" height="20" fill="#ffffff"/>
  <text x="350" y="108" font-size="14" fill="#14110f" text-anchor="middle" font-weight="700">200 mm</text>

  <!-- dimension: pitch 12.5mm -->
  <line x1="580" y1="135" x2="580" y2="160" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="575" y1="135" x2="585" y2="135" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="575" y1="160" x2="585" y2="160" stroke="#16a34a" stroke-width="1.5"/>
  <text x="592" y="152" font-size="13" fill="#16a34a" font-weight="700">12.5 mm 간격</text>

  <!-- strip width note -->
  <text x="592" y="200" font-size="13" fill="#b45309">천 너비 5 mm</text>
  <text x="592" y="222" font-size="13" fill="#b45309">길이 220 mm</text>
  <text x="592" y="244" font-size="12" fill="#8a8a86">(양끝 10mm 여유</text>
  <text x="592" y="262" font-size="12" fill="#8a8a86"> = 케이블 연결용)</text>

  <!-- bottom summary -->
  <rect x="32" y="548" width="716" height="56" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="48" y="574" font-size="14" fill="#14110f"><tspan font-weight="700">한 셀 = 12.5 × 12.5 mm.</tspan>  가로 16줄 × 세로 16줄 = 256셀.  먼저 종이에 이 격자 그리고, 그 위에 올려서 줄 정렬해.</text>
  <text x="48" y="595" font-size="13" fill="#dc2626">⚠ 비뚤어지면 셀이 사다리꼴 → 값 이상. 자 대고 한 줄씩 16번. 귀찮아도 16번.</text>
</svg>
