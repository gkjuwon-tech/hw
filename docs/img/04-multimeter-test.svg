<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#ffffff"/>
  <text x="32" y="46" font-size="26" font-weight="700" fill="#14110f">멀티미터 검사 — 라미네이팅 <tspan fill="#dc2626">전에</tspan> 반드시</text>
  <text x="32" y="74" font-size="15" fill="#8a8a86">빨강=가로줄 끝, 검정=세로줄 끝. 셀을 손가락으로 꾹 → 저항이 뚝 떨어지면 정상.</text>

  <!-- mesh patch -->
  <rect x="60" y="120" width="240" height="240" fill="#fafaf9" stroke="#14110f" stroke-width="2"/>
  <g stroke="#f59e0b" stroke-width="6" opacity="0.85">
    <line x1="70" y1="150" x2="290" y2="150"/><line x1="70" y1="190" x2="290" y2="190"/>
    <line x1="70" y1="230" x2="290" y2="230"/><line x1="70" y1="270" x2="290" y2="270"/>
    <line x1="70" y1="310" x2="290" y2="310"/>
  </g>
  <g stroke="#2563eb" stroke-width="6" opacity="0.65">
    <line x1="100" y1="130" x2="100" y2="350"/><line x1="140" y1="130" x2="140" y2="350"/>
    <line x1="180" y1="130" x2="180" y2="350"/><line x1="220" y1="130" x2="220" y2="350"/>
    <line x1="260" y1="130" x2="260" y2="350"/>
  </g>

  <!-- finger pressing cell (1,1) -->
  <circle cx="100" cy="150" r="20" fill="#fde68a" stroke="#dc2626" stroke-width="3"/>
  <text x="100" y="156" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="700">꾹</text>
  <text x="60" y="392" font-size="13" fill="#dc2626" font-weight="700">셀 (1,1) 꾹 누름</text>

  <!-- red probe to a row end -->
  <line x1="70" y1="230" x2="20" y2="230" stroke="#dc2626" stroke-width="5"/>
  <circle cx="20" cy="230" r="6" fill="#dc2626"/>
  <text x="14" y="218" font-size="12" fill="#dc2626" font-weight="700">빨강 → 가로줄</text>

  <!-- black probe to a col end -->
  <line x1="180" y1="350" x2="180" y2="400" stroke="#111827" stroke-width="5"/>
  <circle cx="180" cy="400" r="6" fill="#111827"/>
  <text x="196" y="404" font-size="12" fill="#111827" font-weight="700">검정 → 세로줄</text>

  <!-- meter readout -->
  <rect x="430" y="120" width="380" height="240" rx="16" fill="#0f172a"/>
  <text x="620" y="156" font-size="15" fill="#94a3b8" text-anchor="middle">멀티미터 (200 kΩ 레인지)</text>

  <!-- before -->
  <rect x="460" y="178" width="150" height="150" rx="12" fill="#1e293b"/>
  <text x="535" y="206" font-size="14" fill="#cbd5e1" text-anchor="middle">누르기 전</text>
  <text x="535" y="252" font-size="30" fill="#fbbf24" text-anchor="middle" font-weight="700">30~100</text>
  <text x="535" y="282" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700">kΩ</text>

  <!-- arrow -->
  <text x="640" y="262" font-size="40" fill="#84cc16" font-weight="700">→</text>
  <text x="640" y="292" font-size="16" fill="#84cc16" text-anchor="middle" font-weight="700">뚝!</text>

  <!-- after -->
  <rect x="650" y="178" width="140" height="150" rx="12" fill="#1e293b"/>
  <text x="720" y="206" font-size="14" fill="#cbd5e1" text-anchor="middle">누른 후</text>
  <text x="720" y="252" font-size="34" fill="#4ade80" text-anchor="middle" font-weight="700">2~10</text>
  <text x="720" y="282" font-size="20" fill="#4ade80" text-anchor="middle" font-weight="700">kΩ</text>

  <!-- warning bar -->
  <rect x="32" y="408" width="796" height="48" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="48" y="430" font-size="14" fill="#b91c1c" font-weight="700">⚠ 라미네이팅하면 코팅에 덮여서 못 고침. 랜덤 8~10셀 검사 통과한 뒤에만 라미네이터에 넣어.</text>
  <text x="48" y="449" font-size="12.5" fill="#7f1d1d">안 떨어지면: 끝단 매니큐어 닦기(단선) 또는 Velostat 한 겹 추가(단락). 영상 찍어서 형한테.</text>
</svg>
