<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="32" y="46" font-size="26" font-weight="700" fill="#14110f">Edge 박스 조립 — 부품을 박스 하나로</text>
  <text x="32" y="74" font-size="15" fill="#8a8a86">왼쪽 부품들을 합쳐서 오른쪽 "한 덩어리 박스"로. SSD 꽂고, 방열판 확인하고, 디스플레이 붙이면 끝.</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- ===== LEFT: exploded ===== -->
  <!-- heatsink/fan (top) -->
  <rect x="120" y="120" width="240" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="240" y="142" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">② 방열판 + 팬 (기본 장착)</text>
  <text x="240" y="158" font-size="11.5" fill="#64748b" text-anchor="middle">팬 커넥터 꽂혀있는지만 확인</text>
  <line x1="240" y1="168" x2="240" y2="190" stroke="#15803d" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- jetson board (center) -->
  <rect x="120" y="196" width="240" height="70" rx="8" fill="#052e16" stroke="#14532d" stroke-width="2.5"/>
  <text x="240" y="226" font-size="15" fill="#bbf7d0" text-anchor="middle" font-weight="700">③ Jetson Orin Nano 보드</text>
  <text x="240" y="246" font-size="11.5" fill="#86efac" text-anchor="middle">개발자 키트 (개봉만, 가장자리만 잡기)</text>
  <!-- microSD to the side -->
  <rect x="372" y="206" width="108" height="34" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="426" y="222" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="700">① microSD</text>
  <text x="426" y="236" font-size="10" fill="#b45309" text-anchor="middle">첫 부팅용(옵션)</text>
  <line x1="372" y1="223" x2="362" y2="223" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- SSD (bottom, into M.2 underside) -->
  <line x1="240" y1="312" x2="240" y2="270" stroke="#15803d" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="120" y="316" width="240" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="338" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">④ NVMe SSD (밑면 M.2)</text>
  <text x="240" y="354" font-size="11.5" fill="#2563eb" text-anchor="middle">비스듬히 꽂고 → 눌러서 → 나사 1개</text>

  <!-- power brick -->
  <rect x="120" y="384" width="240" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="409" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">⑤ 19V 전원어댑터 (공식)</text>

  <!-- ===== big arrow ===== -->
  <text x="512" y="280" font-size="46" fill="#84cc16" font-weight="700" text-anchor="middle">→</text>
  <text x="512" y="312" font-size="13" fill="#65a30d" font-weight="700" text-anchor="middle">합치면</text>

  <!-- ===== RIGHT: assembled box ===== -->
  <!-- display panel -->
  <rect x="600" y="130" width="300" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <rect x="618" y="148" width="264" height="140" rx="6" fill="#16a34a" opacity="0.18"/>
  <text x="750" y="210" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="700">⑥ 7" 터치 디스플레이</text>
  <text x="750" y="234" font-size="12.5" fill="#86efac" text-anchor="middle">키오스크 화면 (verdict 여기 뜸)</text>
  <circle cx="640" cy="306" r="5" fill="#84cc16"/>
  <circle cx="660" cy="306" r="5" fill="#334155"/>
  <!-- jetson tucked behind/under display + VESA mount -->
  <rect x="624" y="328" width="252" height="46" rx="8" fill="#052e16" stroke="#14532d" stroke-width="2"/>
  <text x="750" y="356" font-size="12.5" fill="#bbf7d0" text-anchor="middle" font-weight="700">Jetson (SSD 장착됨) · VESA 마운트</text>
  <!-- cables -->
  <text x="750" y="398" font-size="12" fill="#64748b" text-anchor="middle">HDMI + USB(터치) + 전원 = 7.6.1 에서 연결</text>
  <text x="750" y="418" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">= 한 덩어리 "Edge 박스"</text>

  <!-- bottom note -->
  <rect x="32" y="446" width="896" height="42" rx="10" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
  <text x="48" y="472" font-size="13.5" fill="#3f6212">순서: 개봉 → ④ SSD 장착 → ② 방열/팬 확인 → 케이스/마운트로 ⑥ 디스플레이와 합체 → ⑤ 전원. 그다음 7.1 OS 굽기.</text>
</svg>
