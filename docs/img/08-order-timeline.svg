<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="920" height="540" fill="#ffffff"/>
  <text x="32" y="46" font-size="26" font-weight="700" fill="#14110f">발주 타임라인 — 같은 날 다 질러</text>
  <text x="32" y="74" font-size="15" fill="#8a8a86">Day 0 에 네 군데 동시 발주. 오래 걸리는 PCB가 전체 일정을 정함. 기다리는 동안 깔판 만들어.</text>

  <!-- chart area -->
  <!-- x scale: x = 200 + day*44 (day 0..15) -->
  <!-- grid weeks -->
  <line x1="200" y1="110" x2="200" y2="430" stroke="#84cc16" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="200" y="104" font-size="12" fill="#4d7c0f" text-anchor="middle" font-weight="700">Day 0 발주</text>
  <line x1="508" y1="110" x2="508" y2="430" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="508" y="104" font-size="12" fill="#a8a29e" text-anchor="middle">Day 7</text>
  <line x1="816" y1="110" x2="816" y2="430" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="816" y="104" font-size="12" fill="#a8a29e" text-anchor="middle">Day 14</text>

  <defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3f3f46"/>
    </marker>
  </defs>

  <!-- Row 1: 한국 부품 (디마+쿠팡) day0->2 -->
  <text x="190" y="142" font-size="13" fill="#3f3f46" text-anchor="end" font-weight="600">한국 부품(디마·쿠팡)</text>
  <rect x="200" y="130" width="88" height="20" rx="6" fill="#16a34a"/>
  <text x="298" y="145" font-size="12" fill="#15803d">→ Day 1~2 도착</text>

  <!-- Row 2: Adafruit day0->5 -->
  <text x="190" y="182" font-size="13" fill="#3f3f46" text-anchor="end" font-weight="600">Adafruit(해외)</text>
  <rect x="200" y="170" width="220" height="20" rx="6" fill="#0ea5e9"/>
  <text x="430" y="185" font-size="12" fill="#0369a1">→ Day 4~5 도착</text>

  <!-- Row 3: JLCPCB day0->10 (longest, emphasized) -->
  <text x="190" y="222" font-size="13" fill="#b91c1c" text-anchor="end" font-weight="700">JLCPCB PCB ★</text>
  <rect x="200" y="210" width="440" height="20" rx="6" fill="#ea580c"/>
  <text x="650" y="225" font-size="12" fill="#c2410c" font-weight="700">→ Day 8~10 도착 (제일 김)</text>

  <!-- separator -->
  <line x1="60" y1="252" x2="860" y2="252" stroke="#e7e5e4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="60" y="272" font-size="12" fill="#2563eb" font-weight="700">↓ 네가 손 쓰는 구간 (기다리는 동안)</text>

  <!-- Row 4: 깔판 조립 day3->6 (you) -->
  <text x="190" y="302" font-size="13" fill="#1d4ed8" text-anchor="end" font-weight="600">깔판 만들기(너)</text>
  <rect x="332" y="290" width="132" height="20" rx="6" fill="#2563eb"/>
  <text x="398" y="328" font-size="11.5" fill="#1d4ed8" text-anchor="middle">한국 부품 오면 바로</text>

  <!-- Row 5: PCB조립+펌웨어+inspect day10->12 (you) -->
  <text x="190" y="362" font-size="13" fill="#1d4ed8" text-anchor="end" font-weight="600">PCB+펌웨어+inspect(너)</text>
  <rect x="640" y="350" width="88" height="20" rx="6" fill="#2563eb"/>
  <text x="728" y="365" font-size="11.5" fill="#1d4ed8">→ 데모 가능</text>

  <!-- axis baseline -->
  <line x1="200" y1="430" x2="860" y2="430" stroke="#d6d3d1" stroke-width="2"/>

  <!-- key message -->
  <rect x="32" y="452" width="856" height="64" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="48" y="478" font-size="15" fill="#b91c1c" font-weight="700">핵심 — PCB(주황)가 제일 오래 걸림. Gerber 머지되면 그날 바로 질러.</text>
  <text x="48" y="500" font-size="13" fill="#7f1d1d">한국 부품 기다리는 1~2일에 깔판 만들고, PCB 도착하면 케이블 꽂고 끝. 순서만 지키면 시간 0 낭비.</text>
</svg>
