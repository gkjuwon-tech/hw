name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_wokwi:
        description: "Also run the Wokwi hardware-sim scenarios (needs WOKWI_CLI_TOKEN secret)"
        required: false
        default: "false"

jobs:
  backend:
    name: backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  edge-agent:
    name: edge_agent — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge_agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  desktop:
    name: desktop — lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer (smoke)
        run: npm run build:renderer

  firmware-software-sim:
    # Software-mode scenarios for the tactile-scanner firmware. Runs on every
    # push — no Wokwi token needed, pure host-compiled logic.
    name: firmware — software-mode sim
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/tactile_scanner_esp32/wokwi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build host-mode scanner simulator
        run: make -C host_sim

      - name: Run software-mode scenarios (must be all-green)
        run: python3 run_tests.py --mode software

  firmware-wokwi-sim:
    # Wokwi hardware-in-loop scenarios. NOT run on push — requires the
    # WOKWI_CLI_TOKEN secret and burns ~50s wall-clock per simulation, so
    # this is workflow_dispatch only.
    name: firmware — wokwi hardware sim
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_wokwi == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/tactile_scanner_esp32/wokwi
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arduino-cli
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="${HOME}/.local/bin" sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install esp32 board package
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install wokwi-cli
        run: |
          curl -L https://wokwi.com/ci/install.sh | sh
          echo "${HOME}/.wokwi/bin" >> "${GITHUB_PATH}"

      - name: Build firmware (CDCOnBoot=cdc for native USB)
        run: bash build_firmware.sh

      - name: Run wokwi-mode scenarios
        run: python3 run_tests.py --mode wokwi

  desktop-build-win:
    name: desktop — build windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".\backend"
          pip install pyinstaller

      - name: Install Node deps
        working-directory: desktop
        run: npm ci

      - name: Build Sidecar
        working-directory: desktop
        run: npm run build:sidecar

      - name: Build Windows Executable
        working-directory: desktop
        run: npm run dist:win

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: Conet-Tactile-Windows-Setup
          path: desktop/release/*.exe  pcb-reality-check:
    # Reality-check gate for the PCB manufacturing artifacts. Runs every push.
    # Fails the build if any finding is severity >= CRITICAL (4). Uploads
    # REALITY_CHECK.md and the JSON sidecar as artifacts so reviewers can read
    # the verdict in the PR without checking out the branch.
    name: hardware — PCB reality check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/pcb/conet-scanner-v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build host-mode scanner simulator (used by software_sim)
        run: make -C ../../../firmware/tactile_scanner_esp32/wokwi/host_sim

      - name: Run reality_check (must be all severity < 4)
        run: python3 -m tools.reality_check

      - name: Upload reality-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-check
          path: |
            hardware/pcb/conet-scanner-v1/REALITY_CHECK.md
            hardware/pcb/conet-scanner-v1/reality_check_output/reality_check.json
            firmware/tactile_scanner_esp32/wokwi/diagram.reality.json
