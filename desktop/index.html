    <title>Conet Tactile — Operator</title>
    <!--
      No webfonts. The appliance's display renders with the system UI font,
      and we never want a flash of fallback or a network dependency on a
      cold boot (the kiosk runs with no guaranteed internet).
      The kiosk server injects a <script> with the control-plane base URL
      and the box's token just after <head> at serve time.
    -->
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/typography.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
