appId: studio.conet.tactile.desktop
productName: Conet Tactile
copyright: "Conet Studio"
artifactName: "Conet-Tactile-${version}-${os}-${arch}.${ext}"

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: python-sidecar/dist/sidecar
    to: sidecar
    filter: ["**/*"]

asar: true

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: false
  identity: null
  notarize: false
  icon: build/icon.icns

dmg:
  format: ULFO
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: "Conet Tactile"

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  icon: build/icon.png
  synopsis: "Tactile Cloud desktop dashboard"
