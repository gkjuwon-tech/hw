[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conet-tactile-cloud"
version = "0.1.0"
description = "Conet Tactile Cloud — ingestion, calibration, and inspection service for the Tactile Mesh fleet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Conet Studio" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-json-logger>=2.0",
  "prometheus-client>=0.20",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "respx>=0.21",
]
postgres = [
  "asyncpg>=0.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = [
  "E501",
  # FastAPI's `Depends()` and `Query()` defaults are the idiomatic pattern;
  # B008 fires on every dependency injection, which is noise.
  "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
